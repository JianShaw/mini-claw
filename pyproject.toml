[project]
name = "mini-claw"
version = "0.1.0"
description = "A small Python Mini Claw playground."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mini-claw-chat = "chat.app:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["chat", "claw"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
