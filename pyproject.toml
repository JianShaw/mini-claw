[project]
name = "mini-claw"
version = "0.1.0"
description = "A small Python Mini Claw playground."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckduckgo-search>=7.0.0",
    "fastapi>=0.136.1",
    "fastembed>=0.8.0",
    "mcp>=1.27.1",
    "openai>=2.36.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "sse-starlette>=2.0.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
mini-claw-chat = "chat.app:main"
mini-claw-web = "web.backend.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["chat", "claw", "web", "web.backend"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
